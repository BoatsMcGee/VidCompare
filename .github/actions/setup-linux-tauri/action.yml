name: Setup Linux Tauri build environment
description: >-
  Installs the system packages Tauri needs on Ubuntu runners: GTK/WebKit
  development libraries and tray/SVG dependencies for compilation,
  webkit2gtk-driver (WebKitWebDriver) for tauri-driver, and xvfb for a
  headless display. Single source of truth for the package list — CI,
  E2E, and screenshots jobs all use this action.

runs:
  using: composite
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          webkit2gtk-driver \
          xvfb
