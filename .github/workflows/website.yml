name: Website

# Builds the SvelteKit static site (website/), captures fresh screenshots from
# the app (browser mode), and deploys everything to GitHub Pages.
# Contract with the website milestone: `npm run build` outputs to website/build.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/website.yml'
  workflow_dispatch:
  # Rebuild the site when the E2E workflow finishes so new screenshots are picked up.
  workflow_run:
    workflows: ['E2E & Screenshots']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - name: Install website dependencies
        working-directory: website
        run: npm ci
      - name: Install app dependencies (screenshot capture runs against the app)
        run: npm ci
      - name: Install FFmpeg (mandelbrot fixture for the compare-page shot)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Capture screenshots (browser mode, 2× DPI)
        run: npm run screenshots
      - name: Copy screenshots into the site
        run: |
          mkdir -p website/static/screenshots
          cp tests/screenshots/current/*.png website/static/screenshots/
      - name: Build site
        working-directory: website
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
