name: Release

# Note: GitHub does not support path filters for tag pushes, so all `v*` tags
# build; workflow_dispatch allows dry-run builds without a tag (publishing is
# skipped unless the ref is a tag).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      nightly:
        description: 'Build and publish a rolling nightly pre-release'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos
            # TODO(M9): x86_64-apple-darwin / universal macOS builds need an
            # Intel runner or a cross-compiled sidecar: upstream publishes no
            # macOS prebuilts and the sidecar is built from source here.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Exposed by GitHub-hosted runners (e.g. 20261012.334.1); changes when
      # the image rolls. Used by the sidecar cache key below.
      - name: Export runner image version
        run: echo "ImageRunnerVersion=${ImageVersion:-unknown}" >> "$GITHUB_ENV"

      - name: Cache sidecar
        id: sidecar-cache
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          # The sidecar is built from source on Linux/macOS, so the cache
          # must not outlive the runner image it was linked against: an
          # ubuntu-latest image update can change the system FFmpeg soname
          # (e.g. libavformat.so.60 -> .61) and linuxdeploy then fails with
          # "Could not find dependency: libavformat.so.60". ImageRunnerVersion
          # busts the cache when the image rolls.
          key: sidecar-${{ matrix.platform }}-${{ env.ImageRunnerVersion }}-${{ hashFiles('sidecar-version.json') }}

      # Tauri app build dependencies (Linux) — shared with ci.yml/e2e.yml.
      - name: Install Tauri build dependencies (Linux)
        if: matrix.platform == 'linux'
        uses: ./.github/actions/setup-linux-tauri

      # Sidecar source-build dependencies (Linux/macOS) — upstream only
      # publishes a Windows prebuilt asset (see plan §10, hybrid sourcing).
      - name: Install sidecar build dependencies (Linux)
        if: matrix.platform == 'linux' && steps.sidecar-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config g++ make \
            libavformat-dev libavcodec-dev libavfilter-dev libavutil-dev \
            libswscale-dev libswresample-dev libsdl2-dev libsdl2-ttf-dev
      - name: Install sidecar build dependencies (macOS)
        if: matrix.platform == 'macos' && steps.sidecar-cache.outputs.cache-hit != 'true'
        run: brew install pkg-config ffmpeg sdl2 sdl2_ttf

      # Fetch the pinned sidecar (Windows downloads the verified release zip;
      # Linux/macOS build the pinned tag from source when no asset exists).
      - name: Fetch sidecar (Windows)
        if: matrix.platform == 'windows'
        run: ./scripts/fetch-sidecars.ps1
      - name: Fetch sidecar (Linux/macOS)
        if: matrix.platform != 'windows'
        run: bash scripts/fetch-sidecars.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run build
      # Nightly builds get a numeric-only prerelease version injected via
      # --config so package.json/tauri.conf.json stay untouched (see the
      # script header for why "-nightly.N" fails the Windows msi target).
      - name: Resolve version
        id: version
        shell: bash
        run: scripts/resolve-release-version.sh "${{ inputs.nightly }}" "${{ github.run_number }}"
      # Updater manifest signing (minisign keypair): the private key lives in
      # the TAURI_SIGNING_PRIVATE_KEY secret; tauri build emits *.sig files
      # next to the bundles when it is set. Release artifacts themselves stay
      # unsigned (no code signing — project convention); this is manifest
      # signing only. Portable zips are excluded from auto-update by design.
      #
      # NO_STRIP: linuxdeploy's strip step fails on modern ELF .relr.dyn
      # relocation sections (tauri-apps/tauri#14796) — the maintainer-
      # confirmed workaround is to skip stripping during AppImage bundling.
      # --verbose: at the default log level the bundler swallows linuxdeploy's
      # stderr and reports only "failed to run linuxdeploy"; verbose both
      # surfaces the real error and is reported to fix the bundling outright
      # (tauri-apps/tauri#14796).
      - name: Build app
        run: npx tauri build --verbose --target ${{ matrix.target }} --config '{"version":"${{ steps.version.outputs.version }}"}'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: true

      # Tauri does not produce a plain Windows zip, so assemble the portable
      # artifact here: app exe + sidecar (+ DLLs) + README + LICENSE + marker.
      - name: Create portable zip (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/New-PortableZip.ps1 -Version '${{ steps.version.outputs.version }}' -Target '${{ matrix.target }}'

      - uses: actions/upload-artifact@v7
        with:
          name: vidcompare-${{ matrix.target }}
          retention-days: 30
          # Only the final bundles (installers, updater archives + .sig
          # files) — NOT a recursive glob of bundle/**, which would sweep up
          # the deb/rpm/AppImage staging trees (AppDir libs, data.tar.gz,
          # desktop files) and flood the release with hundreds of junk
          # assets, tripping GitHub's secondary rate limit.
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/*/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/*/*.AppImage.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/*/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/*/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/*/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/*/*.app.tar.gz.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/*/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/*/*.exe.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/*/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/*/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/*/*.msi.sig
            dist/*.zip

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.nightly
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required to dispatch the website rebuild via workflow_dispatch.
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # Semver pre-release tags (e.g. v1.2.0-beta.1) publish as a pre-release
      # and are not marked "Latest"; stable tags become the Latest release.
      # Nightly runs publish to the rolling `nightly` tag instead.
      - name: Detect pre-release tag
        id: prerelease
        run: |
          if [ "${{ inputs.nightly }}" = "true" ]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            tag="${GITHUB_REF_NAME}"
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+- ]]; then
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      # Rolling nightly: delete the previous nightly release + tag so the new
      # one becomes the single "latest nightly" pre-release.
      - name: Delete previous nightly release
        if: inputs.nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete nightly --yes --cleanup-tag || true

      - name: Create nightly tag
        if: inputs.nightly
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag nightly "$GITHUB_SHA"
          git push origin nightly --force

      # Generate the updater manifest (latest.json) consumed by the
      # tauri-plugin-updater endpoint configured in tauri.conf.json
      # (releases/latest/download/latest.json). Only attached to stable
      # releases — nightlies are never "Latest", so the endpoint keeps
      # pointing at the last stable manifest.
      - name: Generate updater manifest
        if: ${{ !inputs.nightly }}
        run: scripts/generate-updater-manifest.sh "${GITHUB_REF_NAME}"

      # Attaches installers, the Windows portable zip, the updater .sig files,
      # the updater manifest (stable releases only), and the standalone option
      # profiles + index (all profiles are OS-independent).
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: ${{ inputs.nightly && 'nightly' || github.ref_name }}
          name: ${{ inputs.nightly && format('Nightly build {0}', github.run_number) || github.ref_name }}
          generate_release_notes: ${{ !inputs.nightly }}
          body: ${{ inputs.nightly && format('Automated nightly build of `main` @ {0}. Unsigned pre-release — not marked Latest.', github.sha) || '' }}
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          make_latest: ${{ steps.prerelease.outputs.is_prerelease == 'true' && 'false' || 'true' }}
          files: |
            artifacts/**/*
            public/profiles/video-compare-latest.json
            profiles/profiles-index.json
            ${{ !inputs.nightly && 'latest.json' || '' }}

      # Rebuild the Pages site so download links and the changelog pick up the
      # new release (deferred from M6). Nightlies skip this — the website
      # tracks stable releases. Dispatch on main explicitly: the default ref
      # is the triggering tag, and Pages deploys from a tag ref fail.
      - name: Dispatch website rebuild
        if: ${{ !inputs.nightly }}
        uses: benc-uk/workflow-dispatch@v1.2.4
        with:
          workflow: website.yml
          ref: main
          token: ${{ github.token }}
