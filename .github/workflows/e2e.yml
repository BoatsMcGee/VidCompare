name: E2E & Screenshots

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'src-tauri/**'
      - 'profiles/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'svelte.config.js'
      - 'tsconfig*.json'
      - 'index.html'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'src-tauri/**'
      - 'profiles/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'svelte.config.js'
      - 'tsconfig*.json'
      - 'index.html'
      - '.github/workflows/e2e.yml'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-browser:
    name: E2E (browser mode, no display)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build frontend only (no Rust)
        run: npm run build
      - name: Run E2E in browser mode (mocked IPC, headless Chrome)
        env:
          E2E_MODE: browser
        run: npm run e2e

  e2e-native:
    name: E2E (native Tauri, requires display)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # This job REQUIRES a display server (xvfb-run). It will be skipped
    # on environments without GPU/display support unless explicitly enabled.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Frontend must exist before cargo build: tauri-codegen embeds
      # ../dist (frontendDist) when compiling the app crate.
      - run: npm ci
      - name: Build frontend
        run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux Tauri build dependencies
        uses: ./.github/actions/setup-linux-tauri
      # Compile-only stub: the native smoke tests never launch video-compare
      # (a failed resolve_binary only shows a dismissible banner), so the
      # real sidecar isn't needed here.
      - name: Create sidecar stub (compile-only)
        run: bash scripts/fetch-sidecars.sh --stub
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      - name: Build Tauri app (release)
        run: cargo build --release
        working-directory: src-tauri
      # No TAURI_DRIVER_PATH: ${{ env.HOME }} is not available in the env
      # context, and tauri-service already finds tauri-driver on PATH.
      - name: Run E2E in native mode (xvfb-run)
        env:
          E2E_MODE: native
          # WebKitGTK ≥2.42 renders a blank webview under Xvfb (no GPU) unless
          # DMABUF/compositing are disabled — tauri-apps/tauri#15936, #9304.
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" npm run e2e

  screenshots:
    name: Screenshot capture & regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # This job REQUIRES a display server (xvfb-run) for native Tauri captures.
    # It runs after e2e-native to reuse the built binary.
    needs: e2e-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Frontend must exist before cargo build: tauri-codegen embeds
      # ../dist (frontendDist) when compiling the app crate.
      - run: npm ci
      - name: Build frontend
        run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux Tauri build dependencies
        uses: ./.github/actions/setup-linux-tauri
      # Compile-only stub: screenshot capture never launches video-compare.
      - name: Create sidecar stub (compile-only)
        run: bash scripts/fetch-sidecars.sh --stub
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      - name: Build Tauri app (release)
        run: cargo build --release
        working-directory: src-tauri
      # No TAURI_DRIVER_PATH: ${{ env.HOME }} is not available in the env
      # context, and capture.mjs already falls back to tauri-driver on PATH.
      - name: Capture screenshots (xvfb-run, 2× DPI)
        env:
          # See e2e-native: blank webview under Xvfb without these.
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" npm run screenshots
      # Baselines get committed from the artifact only after the first
      # intentional capture; seed them here instead of failing the gate.
      - name: Compare screenshots (regression check)
        run: |
          if compgen -G 'tests/screenshots/baseline/*.png' > /dev/null; then
            npm run screenshots:compare
          else
            echo "No committed baselines yet — seeding from current captures."
            npm run screenshots:compare -- --update
          fi
      - name: Upload screenshots as artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-current
          path: |
            tests/screenshots/current/*.png
            tests/screenshots/baseline/*.png
          retention-days: 7
      - name: Upload diff images on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-diff
          path: tests/screenshots/diff/*.png
          retention-days: 7

  screenshots-update:
    name: Update screenshot baselines (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Manual workflow dispatch to refresh baselines when UI intentionally changes.
    # Requires display (xvfb-run).
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Frontend must exist before cargo build: tauri-codegen embeds
      # ../dist (frontendDist) when compiling the app crate.
      - run: npm ci
      - name: Build frontend
        run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux Tauri build dependencies
        uses: ./.github/actions/setup-linux-tauri
      # Compile-only stub: screenshot capture never launches video-compare.
      - name: Create sidecar stub (compile-only)
        run: bash scripts/fetch-sidecars.sh --stub
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      - name: Build Tauri app (release)
        run: cargo build --release
        working-directory: src-tauri
      # No TAURI_DRIVER_PATH: ${{ env.HOME }} is not available in the env
      # context, and capture.mjs already falls back to tauri-driver on PATH.
      - name: Capture screenshots (xvfb-run, 2× DPI)
        env:
          # See e2e-native: blank webview under Xvfb without these.
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" npm run screenshots
      - name: Update baselines
        run: npm run screenshots:compare --update
      - name: Upload updated baselines
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-baseline
          path: tests/screenshots/baseline/*.png
          retention-days: 30