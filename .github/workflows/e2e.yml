name: E2E & Screenshots

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'src-tauri/**'
      - 'profiles/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'svelte.config.js'
      - 'tsconfig*.json'
      - 'index.html'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'src-tauri/**'
      - 'profiles/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'svelte.config.js'
      - 'tsconfig*.json'
      - 'index.html'
      - '.github/workflows/e2e.yml'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-browser:
    name: E2E (browser mode, no display)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build frontend only (no Rust)
        run: npm run build
      - name: Run E2E in browser mode (mocked IPC, headless Chrome)
        env:
          E2E_MODE: browser
        run: npm run e2e