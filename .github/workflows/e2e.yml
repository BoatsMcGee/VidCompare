name: E2E & Screenshots

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'src-tauri/**'
      - 'profiles/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'svelte.config.js'
      - 'tsconfig*.json'
      - 'index.html'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'src-tauri/**'
      - 'profiles/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'svelte.config.js'
      - 'tsconfig*.json'
      - 'index.html'
      - '.github/workflows/e2e.yml'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-browser:
    name: E2E (browser mode, no display)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build frontend only (no Rust)
        run: npm run build
      - name: Run E2E in browser mode (mocked IPC, headless Chrome)
        env:
          E2E_MODE: browser
        run: npm run e2e

  e2e-native:
    name: E2E (native Tauri, Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Frontend must exist before cargo build: tauri-codegen embeds
      # ../dist (frontendDist) when compiling the app crate.
      - run: npm ci
      - name: Build frontend
        run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      # Compile-only stub: the native smoke tests never launch video-compare
      # (a failed resolve_binary only shows a dismissible banner), so the
      # real sidecar isn't needed here.
      - name: Create sidecar stub (compile-only)
        run: ./scripts/fetch-sidecars.ps1 -Stub
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      - name: Install WebView2 Runtime
        run: |
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "webview2installer.exe"
          Start-Process -Wait -FilePath "webview2installer.exe" -ArgumentList "/silent", "/install"
      - name: Build Tauri app (release)
        run: cargo build --release
        working-directory: src-tauri
      - name: Run E2E in native mode
        env:
          E2E_MODE: native
        run: npm run e2e

  screenshots:
    name: Screenshot capture & regression
    runs-on: windows-latest
    timeout-minutes: 30
    # Runs after e2e-native to reuse the built binary.
    needs: e2e-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Frontend must exist before cargo build: tauri-codegen embeds
      # ../dist (frontendDist) when compiling the app crate.
      - run: npm ci
      - name: Build frontend
        run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      # Compile-only stub: screenshot capture never launches video-compare.
      - name: Create sidecar stub (compile-only)
        run: ./scripts/fetch-sidecars.ps1 -Stub
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      - name: Install WebView2 Runtime
        run: |
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "webview2installer.exe"
          Start-Process -Wait -FilePath "webview2installer.exe" -ArgumentList "/silent", "/install"
      - name: Build Tauri app (release)
        run: cargo build --release
        working-directory: src-tauri
      - name: Capture screenshots (2× DPI)
        run: npm run screenshots
      # Baselines get committed from the artifact only after the first
      # intentional capture; seed them here instead of failing the gate.
      - name: Compare screenshots (regression check)
        run: |
          if (Test-Path tests/screenshots/baseline/*.png) {
            npm run screenshots:compare
          } else {
            echo "No committed baselines yet — seeding from current captures."
            npm run screenshots:compare -- --update
          }
        shell: pwsh
      - name: Upload screenshots as artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-current
          path: |
            tests/screenshots/current/*.png
            tests/screenshots/baseline/*.png
          retention-days: 7
      - name: Upload diff images on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-diff
          path: tests/screenshots/diff/*.png
          retention-days: 7

  screenshots-update:
    name: Update screenshot baselines (manual)
    runs-on: windows-latest
    timeout-minutes: 30
    # Manual workflow dispatch to refresh baselines when UI intentionally changes.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Frontend must exist before cargo build: tauri-codegen embeds
      # ../dist (frontendDist) when compiling the app crate.
      - run: npm ci
      - name: Build frontend
        run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      # Compile-only stub: screenshot capture never launches video-compare.
      - name: Create sidecar stub (compile-only)
        run: ./scripts/fetch-sidecars.ps1 -Stub
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      - name: Install WebView2 Runtime
        run: |
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "webview2installer.exe"
          Start-Process -Wait -FilePath "webview2installer.exe" -ArgumentList "/silent", "/install"
      - name: Build Tauri app (release)
        run: cargo build --release
        working-directory: src-tauri
      - name: Capture screenshots (2× DPI)
        run: npm run screenshots
      - name: Update baselines
        run: npm run screenshots:compare --update
      - name: Upload updated baselines
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-baseline
          path: tests/screenshots/baseline/*.png
          retention-days: 30